<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --bg: #f5f1e8;
    --surface: #ffffff;
    --ink: #262b22;
    --moss: #3f5c40;
    --moss-dark: #2c422d;
    --rust: #b5592e;
    --sand: #a79c87;
    --line: #ddd5c3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding-bottom: 60px; }

  header {
    background: var(--moss);
    color: #f5f1e8;
    padding: 28px 20px 24px;
    border-bottom: 4px solid var(--moss-dark);
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.75;
    font-weight: 700;
    margin: 0 0 6px;
  }
  header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.01em;
  }
  header p.sub {
    margin: 8px 0 0;
    font-size: 13.5px;
    opacity: 0.85;
    line-height: 1.5;
  }

  .panel {
    background: var(--surface);
    margin: 16px 16px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .setup {
    margin: 16px;
    padding: 16px;
    border: 1px dashed var(--rust);
    border-radius: 10px;
    background: #fbf1ec;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .setup code {
    background: #fff;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  form.add {
    padding: 16px;
    display: grid;
    gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  form.add .row {
    display: grid;
    grid-template-columns: 1fr 72px;
    gap: 8px;
  }
  input {
    font: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fbfaf6;
    color: var(--ink);
    width: 100%;
  }
  input:focus {
    outline: none;
    border-color: var(--moss);
    background: #fff;
  }
  input[name="qty"] { text-align: center; font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  button.submit {
    font: inherit;

    background: var(--rust);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 11px;
    cursor: pointer;
  }
  button.submit:active { transform: translateY(1px); }
  button.submit:disabled { opacity: 0.5; cursor: default; }

  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item {
    display: grid;
    grid-template-columns: 24px 1fr auto 28px;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  li.item:last-child { border-bottom: none; }
  li.item::before {
    content: "";
    position: absolute;
    left: -1px;
    top: 50%;
    width: 10px;
    height: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--moss);
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
  }
  .check.done { background: var(--moss); }
  .check.done::after {
    content: "";
    width: 9px;
    height: 5px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(1px, -1px);
  }

  .info { min-width: 0; }
  .name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }
  .name.done { text-decoration: line-through; color: var(--sand); font-weight: 500; }
  .who {
    font-size: 12.5px;
    color: var(--sand);
    margin-top: 2px;
  }
  .who b { color: var(--moss-dark); font-weight: 700; }

  .qty {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 13px;
    color: var(--rust);
    font-weight: 700;
    white-space: nowrap;
    background: #f5ece5;
    padding: 3px 7px;
    border-radius: 5px;
  }

  .del {
    background: none;
    border: none;
    color: var(--sand);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .del:hover { color: var(--rust); }

  .empty {
    padding: 32px 20px;
    text-align: center;
    color: var(--sand);
    font-size: 14px;
  }

    margin: 18px 16px 0;
    font-size: 12px;
